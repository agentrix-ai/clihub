[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-cli-hub"
version = "0.2.0"
description = "Unified CLI gateway for enterprise platforms — one Skill to search, install, auth and invoke WeCom / DingTalk / Lark CLIs"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "xray918", email = "xray918@example.com" }
]
keywords = ["cli", "hub", "gateway", "agent", "wecom", "dingtalk", "lark", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.15",
    "rich>=13.0",
    "pydantic>=2.0",
    "jieba>=0.42",
    "httpx>=0.27",
]

[project.scripts]
cli-hub = "cli_gateway.__main__:main"

[project.urls]
Homepage = "https://github.com/agentrix-ai/clihub"
Repository = "https://github.com/agentrix-ai/clihub"

[tool.hatch.build.targets.wheel]
packages = ["cli_gateway"]

[tool.hatch.build]
artifacts = ["cli_gateway/schemas/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "fastapi>=0.135.3",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
